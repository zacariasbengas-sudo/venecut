name: gerar-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon

      - name: Preparar arquivo
        run: cp app/build/outputs/apk/release/app-release.apk VeneCut.apk

      - name: Publicar para download
        uses: actions/upload-artifact@v4
        with:
          name: VeneCut-apk
          path: VeneCut.apk

      - name: Criar Release com link fixo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VeneCut - APK automatico
          files: VeneCut.apk
